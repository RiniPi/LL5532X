# GitHub Pages site configuration
# Build: GitHub Pages (Settings -> Pages -> Deploy from a branch -> main / (root))
# Theme: Just the Docs, loaded as a remote theme (supported by GitHub Pages)

title: "Beyond Accuracy"
description: >-
  Beyond Accuracy (Predicting Privacy): model evaluation, data leakage
  detection, error analysis and responsible AI in an NLP study of 1,265
  European Court of Human Rights Article 8 judgments (2010–2023).
  LL5532X Group Project, Group 1.
lang: en-GB

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter

color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 4
  preview_words_after: 8
  button: false
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "View on GitHub":
    - "https://github.com/RiniPi/LL5532X"
aux_links_new_tab: true

gh_edit_link: false

footer_content: >-
  LL5532X Group Project (Data Investigation), Group 1 · Amanda Lim Jin Mei ·
  Nicha Nutchayangkul · Rini Pinasthika · Sophia Emily Lin.
  Judgment texts © Council of Europe / European Court of Human Rights (HUDOC).

callouts:
  key:
    title: Key finding
    color: blue
  caution:
    title: Caution
    color: yellow
  note:
    title: Note
    color: grey-dk

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Only the website pages, figures and rendered notebooks are published.
# Data, models, raw notebooks and course documents stay in the repository
# (and are linked from the "Code & data" page) but are not served by the site.
exclude:
  - README.md
  - requirements.txt
  - data/
  - models/
  - notebooks/
  - docs/
  - results/prelim/
  - "results/final/**/*.csv"
  - "results/final/**/*.xlsx"
  - "results/final/**/*.txt"
  - .github/
  - Gemfile
  - Gemfile.lock
  - vendor/
